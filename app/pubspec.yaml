name: app
description: "Beecbile Call Tracker – Phase 1. Internal call logging app for Samsung business phones."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  equatable: ^2.0.8

  # Local database
  drift: ^2.20.0
  drift_flutter: ^0.2.4

  # HTTP / Convex Cloud
  dio: ^5.7.0

  # Connectivity
  connectivity_plus: ^6.1.4

  # Background sync
  workmanager: ^0.5.2

  # Device information
  device_info_plus: ^11.3.3

  # Settings persistence
  shared_preferences: ^2.3.4

  # Runtime permissions
  permission_handler: ^12.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
